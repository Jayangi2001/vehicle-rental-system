server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        # 1. Auth Service Route
        - id: user-auth-service
          uri: http://localhost:8081
          predicates:
            - Path=/auth/**

        # 2. Vehicle Service Route 
        - id: vehicle-service
          uri: http://localhost:8082
          predicates:
            - Path=/vehicles/**

        # 3. Rental & Payment Service Route
        - id: rental-payment-service
          uri: http://localhost:8083
          predicates:
            - Path=/payments/**, /rentals/**

      # CORS Configuration 
      globalcors:
        cors-configurations:
          '[/**]':
            allowed-origins: "*"
            allowed-methods: "*"
            allowed-headers: "*"